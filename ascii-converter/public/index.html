<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII//CONVERTER</title>
<style>
:root{--bg:#000;--fg:#fff;--dim:#777}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
 font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace}
main{max-width:860px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:clamp(22px,5vw,34px);margin:0 0 6px;letter-spacing:3px;font-weight:700}
.sub{color:var(--dim);margin:0 0 36px;font-size:14px}
.cur::after{content:"█";animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.drop{border:1px dashed var(--fg);padding:34px 16px;text-align:center;cursor:pointer}
.drop:hover,.drop.over{background:var(--fg);color:var(--bg)}
.drop small{display:block;margin-top:8px;color:inherit;opacity:.6}
input[type=file]{display:none}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:22px 0}
label{font-size:14px;display:flex;gap:10px;align-items:center}
input[type=range]{accent-color:#fff;width:180px}
input[type=checkbox]{accent-color:#fff}
button{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--fg);
 padding:10px 18px;letter-spacing:2px;cursor:pointer}
button:hover:not(:disabled){background:var(--fg);color:var(--bg)}
button:disabled{opacity:.35;cursor:not-allowed}
#status{min-height:1.4em;font-size:14px;color:var(--dim);margin-top:6px}
#out{display:none;margin-top:26px}
#view{border:1px solid var(--fg);padding:14px;overflow:auto;max-height:70vh}
pre{margin:0;white-space:pre;color:var(--fg)}
.dl{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <h1>ASCII//CONVERTER</h1>
  <p class="sub">&gt; upload target image<span class="cur"></span></p>

  <div class="drop" id="drop">[ SELECT FILE ] or drop it here<small id="fname">no file selected</small></div>
  <input type="file" id="file" accept="image/*">

  <div class="row">
    <label>WIDTH <input type="range" id="w" min="40" max="200" value="100"><span id="wv">100</span></label>
    <label><input type="checkbox" id="inv"> INVERT</label>
    <button id="go" disabled>[ CONVERT ]</button>
  </div>
  <div id="status"></div>

  <div id="out">
    <div id="view"><pre id="art"></pre></div>
    <div class="dl">
      <button id="dpng">[ DOWNLOAD PNG ]</button>
      <button id="dtxt">[ DOWNLOAD TXT ]</button>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const drop = $("drop"), file = $("file"), go = $("go"), status = $("status");
let blob = null, text = "";

const MAX_SIDE = 1200;
const say = t => status.textContent = t ? "> " + t : "";

drop.onclick = () => file.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over");
  if (e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); };
file.onchange = () => file.files[0] && pick(file.files[0]);
$("w").oninput = e => $("wv").textContent = e.target.value;

// shrink client-side so the upload stays well under the host's body limit
async function pick(f){
  if (!f.type.startsWith("image/")) return say("not an image");
  say("preparing...");
  try {
    const bmp = await createImageBitmap(f);
    const s = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    const x = c.getContext("2d"); x.fillStyle = "#000"; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(bmp, 0, 0, c.width, c.height);
    blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.92));
    $("fname").textContent = f.name;
    go.disabled = false; say("ready");
  } catch { say("cannot read this image"); }
}

go.onclick = async () => {
  if (!blob) return;
  go.disabled = true; say("converting...");
  try {
    const r = await fetch(`/api/convert?width=${$("w").value}&invert=${$("inv").checked ? 1 : 0}`,
      { method: "POST", body: blob });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "failed");
    text = d.ascii; show(d.cols); say("done");
  } catch (e) { say("error: " + e.message); }
  go.disabled = false;
};

function show(cols){
  const pre = $("art"), box = $("view");
  $("out").style.display = "block";
  pre.textContent = text;
  const avail = box.clientWidth - 30;
  const fs = Math.max(4, Math.min(12, Math.floor(avail / (cols * 0.6))));
  pre.style.fontSize = fs + "px"; pre.style.lineHeight = (fs * 1.2) + "px";
  pre.style.fontFamily = '"Courier New",ui-monospace,Menlo,Consolas,monospace';
}

function save(url, name){
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
}
$("dtxt").onclick = () => {
  const u = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
  save(u, "ascii.txt"); setTimeout(() => URL.revokeObjectURL(u), 1000);
};
$("dpng").onclick = () => {
  const lines = text.split("\n"), fs = 12, sc = 2, pad = 24;
  const font = `${fs * sc}px "Courier New",ui-monospace,Menlo,Consolas,monospace`;
  const c = document.createElement("canvas"), x = c.getContext("2d");
  x.font = font;
  const cw = x.measureText("M").width, lh = cw * 2;   // 2:1 keeps proportions
  const cols = Math.max(...lines.map(l => l.length));
  c.width = Math.ceil(cols * cw + pad * 2 * sc); c.height = Math.ceil(lines.length * lh + pad * 2 * sc);
  x.fillStyle = "#000"; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = "#fff"; x.font = font; x.textBaseline = "top";
  lines.forEach((l, i) => x.fillText(l, pad * sc, pad * sc + i * lh));
  c.toBlob(b => { const u = URL.createObjectURL(b); save(u, "ascii.png");
    setTimeout(() => URL.revokeObjectURL(u), 1000); });
};
</script>
</body>
</html>
